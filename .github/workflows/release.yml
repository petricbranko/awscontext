name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build
        run: |
          echo "${GITHUB_REF_NAME#v}" > VERSION
          ./scripts/build-app.sh
          cd build && ditto -c -k --keepParent AWSContext.app "AWSContext-${GITHUB_REF_NAME}.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/AWSContext-${GITHUB_REF_NAME}.zip" --generate-notes
